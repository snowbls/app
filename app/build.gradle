plugins { id 'com.android.application' }

android {
    namespace 'com.snowbls.jinguukan'
    compileSdk 34
    defaultConfig {
        applicationId 'com.snowbls.jinguukan'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName 'build ' + (System.getenv('GITHUB_RUN_NUMBER') ?: 'local')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
