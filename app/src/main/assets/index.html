<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNOW</title><meta name="apple-mobile-web-app-title" content="SNOW">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2FBF5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFFFFF;--ink:#1B1F24;--ink2:#5B6B7D;--line:#ECEFF2;--soft:#F5F6F8;
  --room:#8DA8CE;--mine:#A4E07F;--green:#2FBF5B;--badge:#2FBF5B;--chip:rgba(0,0,0,.18);
  --body:'IBM Plex Sans KR','M PLUS Rounded 1c',sans-serif;--jp:'M PLUS Rounded 1c','IBM Plex Sans KR',sans-serif;
}
html,body{height:100%;background:#E9EDF1}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;overflow:hidden}
button,input{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2.5px solid var(--green);outline-offset:2px}
.ms{width:1em;height:1em;overflow:hidden;font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:26px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:'liga';user-select:none}
.jp{font-family:var(--jp)}
.kr{display:block;font-size:13.5px;color:#5B6B7D;line-height:1.45;margin-top:2px;font-family:var(--body)}

#app{height:100dvh;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:380px minmax(0,1fr);background:var(--bg);position:relative;overflow:hidden}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
#list{border-right:1px solid var(--line)}
.lhd{display:flex;align-items:center;gap:2px;padding:16px 10px 8px 18px;min-height:62px}
.lhd h1{font-size:21px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.scroll{flex:1;overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar,.msgs::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb,.msgs::-webkit-scrollbar-thumb{background:#CCD3DA;border-radius:3px}
.tabbar{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:#9AA5B1;position:relative}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ms{font-variation-settings:'FILL' 1}
.tabbar .bd{position:absolute;top:4px;left:calc(50% + 6px);background:var(--badge);color:#fff;font-size:11px;border-radius:9px;padding:0 5px;line-height:17px;min-width:17px;text-align:center}

.ph{background:repeating-linear-gradient(135deg,#EEF2F6 0 7px,#E3E9EF 7px 14px);border:1.5px dashed #A9B9CA;color:var(--ink2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.2;flex:none}
.av{width:48px;height:48px;border-radius:50%}
.av.s{width:38px;height:38px;font-size:9px}
.av.l{width:60px;height:60px}

/* home */
.sbx{margin:2px 18px 8px;background:var(--soft);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;color:#9AA5B1;font-size:14.5px}
.sbx .ms{font-size:20px}
.me{display:flex;align-items:center;gap:14px;padding:10px 18px 14px;width:100%;text-align:left}
.me b{font-size:17px;display:block}.me p{font-size:13.5px;color:var(--ink2)}
.sec{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px;font-size:13.5px;color:var(--ink2);font-weight:500;border-top:8px solid var(--soft)}
.fr{display:flex;align-items:center;gap:13px;padding:8px 18px;width:100%;text-align:left}
.fr .m{flex:1;min-width:0}
.fr b{font-size:15.5px;display:block}
.fr p{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* talk list */
.cl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:9px 18px}
.cl.on{background:var(--soft)}
.cl .m{flex:1;min-width:0}
.cl .t{display:flex;gap:4px;min-width:0;align-items:baseline}
.cl .t b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .t span{font-size:14px;color:var(--ink2);flex:none}
.cl p{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cl .r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11.5px;color:#9AA5B1;flex:none}
.cl .r i{font-style:normal;background:var(--badge);color:#fff;font-size:11.5px;border-radius:10px;padding:0 6px;line-height:19px;min-width:19px;text-align:center}
.cl .off{font-size:11px;color:#fff;background:#3F4B5B;border-radius:4px;padding:0 4px;margin-right:2px}

/* settings */
.setrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 20px;font-size:15.5px;border-bottom:1px solid var(--line)}
.setrow small{display:block;font-size:12.5px;color:var(--ink2)}
.setrow.warn{color:#D9534F;font-weight:700}

/* room */
#room{background:var(--room)}
.rhd{display:flex;align-items:center;gap:0;padding:8px 6px;background:var(--room);color:#fff;min-height:58px}
.rhd .ib{color:#fff}
.rhd .tt{flex:1;min-width:0;padding-left:4px;font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhd .tt span{font-weight:400;opacity:.9;margin-left:3px}
.back{display:none}
.shd{display:none;align-items:center;gap:6px;padding:8px 8px;background:var(--room);min-height:58px}
.shd input{flex:1;border:none;border-radius:8px;padding:9px 12px;font-size:16px;background:#fff;outline:none}
.shd .ib{color:#fff}
#room.searching .rhd{display:none}#room.searching .shd{display:flex}
.msgs{flex:1;overflow-y:auto;min-height:0;padding:4px 12px 16px}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;text-align:center;padding:30px}
.day{text-align:center;margin:16px 0 8px}
.day span{display:inline-block;background:var(--chip);color:#fff;font-size:12px;padding:3px 12px;border-radius:12px}
.sys{text-align:center;margin:8px auto}
.sys span{display:inline-block;background:var(--chip);color:#fff;font-size:12px;padding:4px 12px;border-radius:12px;max-width:90%}
.mg{display:flex;gap:8px;align-items:flex-start;margin-top:3px;border-radius:12px;transition:background .5s}
.mg.first{margin-top:10px}
.mg .avw{width:38px;flex:none}
.mg .body{display:flex;flex-direction:column;max-width:72%;min-width:0}
.mg .nm{font-size:12.5px;color:#fff;margin:0 0 3px 2px}
.mg .row{display:flex;align-items:flex-end;gap:5px}
.bub{position:relative;background:#fff;border-radius:18px;padding:8px 12px;font-family:var(--jp);font-size:15.5px;line-height:1.5}
.mg.first:not(.me) .bub::before{content:"";position:absolute;left:-5px;top:8px;width:12px;height:12px;background:#fff;border-radius:0 0 0 12px;clip-path:polygon(100% 0,0 0,100% 100%)}
.mg .st{display:flex;flex-direction:column;align-items:flex-end;font-size:10.5px;color:#EEF3FA;line-height:1.25;flex:none;padding-bottom:1px}
.mg:not(.me) .st{align-items:flex-start}
.mg.me{flex-direction:row-reverse}
.mg.me .body{align-items:flex-end}
.mg.me .row{flex-direction:row-reverse}
.mg.me .bub{background:var(--mine)}
.mg.me .bub .kr{color:#3E5A33}
.mg.me.first .bub::before{content:"";position:absolute;right:-5px;top:8px;width:12px;height:12px;background:var(--mine);clip-path:polygon(0 0,100% 0,0 100%)}
.mg.flash{background:rgba(255,236,170,.6)}
.pic{width:200px;aspect-ratio:4/3;border-radius:14px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.8)}
.stp{width:120px;height:110px;border-radius:12px;font-size:12px;background:rgba(255,255,255,.35);border-color:rgba(255,255,255,.8);color:#fff}
mark{background:#FFE08A;color:inherit;border-radius:3px}
mark.cur{background:#FFB547}
.inb{display:flex;align-items:center;gap:4px;padding:6px 6px;background:#fff;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.inb .ib{color:#6B7785}
.inb input{flex:1;border:none;background:var(--soft);border-radius:20px;padding:9px 14px;font-size:16px;outline:none;min-width:0}
.sbar{display:none;align-items:center;gap:6px;padding:8px 12px;background:#fff;font-size:14px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
#room.searching .inb{display:none}#room.searching .sbar{display:flex}
.sbar .cnt{flex:1;color:var(--ink2)}

/* drawer / sheet */
.drawer{position:absolute;inset:0;z-index:40;display:none;background:rgba(0,0,0,.3)}
.drawer.on{display:flex;justify-content:flex-end}
.drawer .in{width:min(330px,88%);background:#fff;height:100%;overflow-y:auto;padding:18px 0 30px}
.drawer h3{font-size:16.5px;padding:0 18px 10px}
.dicons{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 10px 14px;border-bottom:8px solid var(--soft)}
.dicons button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;padding:8px 0}
.drawer .cap{padding:14px 18px 4px;font-size:13px;color:var(--ink2)}
.sheet{position:absolute;inset:0;z-index:45;display:none;background:#fff;flex-direction:column}
.sheet.on{display:flex}
.sheet .hd{display:flex;align-items:center;gap:4px;padding:10px 6px;border-bottom:1px solid var(--line)}
.sheet .hd b{flex:1;font-size:16.5px}
.note{padding:16px 18px;border-bottom:8px solid var(--soft)}
.note .who{display:flex;align-items:center;gap:10px;font-size:13.5px}
.note .who small{display:block;color:var(--ink2);font-size:12px}
.note h4{font-size:17px;margin:12px 0 6px}
.note p{font-size:15px;line-height:1.7}
.note table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14.5px}
.note td{padding:7px 2px;border-bottom:1px solid var(--line);vertical-align:top}
.note td:first-child{color:var(--green);font-weight:700;width:1%;white-space:nowrap;padding-right:14px}
.alb{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.alb .ph{aspect-ratio:1;font-size:11.5px;padding:6px;cursor:pointer}

/* profile */
.ov{position:absolute;inset:0;z-index:60;display:none}
.ov.on{display:flex}
#pf{flex-direction:column;background:#fff;overflow-y:auto}
.pf-cover{position:relative;height:44vh;min-height:260px;flex:none}
.pf-cover .ph{position:absolute;inset:0;border:none;font-size:13px;cursor:pointer}
.pf-x{position:absolute;top:10px;left:8px;z-index:2;background:rgba(0,0,0,.25);color:#fff}
.pf-av{width:100px;height:100px;border-radius:50%;margin:-50px auto 0;position:relative;z-index:2;border:4px solid #fff;font-size:11.5px;cursor:pointer}
.pf-nm{text-align:center;font-size:21px;font-weight:700;margin-top:8px}
.pf-msg{text-align:center;font-family:var(--jp);font-size:15px;margin:4px 24px 0;color:#3A4450}
.pf-acts{display:flex;justify-content:center;gap:40px;margin:18px 0 6px}
.pf-acts button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--ink)}
.pf-info{margin:10px 18px 0;padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:center;gap:16px;font-size:13.5px;color:var(--ink2)}
.tl{border-top:8px solid var(--soft);padding:6px 0 30px}
.tl h3{font-size:15px;padding:12px 18px 4px}
.post{padding:12px 18px;border-bottom:1px solid var(--line)}
.post .who{display:flex;gap:10px;align-items:center;font-size:13.5px}
.post .who small{display:block;color:var(--ink2);font-size:12px}
.post .ph{width:100%;aspect-ratio:16/10;border-radius:10px;margin-top:10px;font-size:12.5px;cursor:pointer}
.post .c1{font-family:var(--jp);font-size:15px;margin-top:8px}
.post .cm{margin-top:6px;padding:8px 12px;background:var(--soft);border-radius:10px}
.post .cm div{font-size:13.5px;margin:4px 0;line-height:1.5}
.post .cm b{margin-right:6px}

/* login */
#login{background:#fff;flex-direction:column;align-items:center;overflow-y:auto;padding:54px 20px 30px}
#login .logo{width:76px;height:76px;border-radius:22px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}#login .logo .ms{font-size:44px}#login h2{font-size:21px;margin-top:14px}
#login .sub{font-size:14px;color:var(--ink2);text-align:center;margin:6px 0 24px}
.accs{flex:none;width:100%;max-width:400px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.acc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line)}
.acc:last-child{border:none}
.acc b{font-size:15px;display:block}.acc small{font-size:12px;color:var(--ink2)}
.pin{flex:none;width:100%;max-width:400px;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;display:none;text-align:center}
.pin.on{display:block}
.dots{display:flex;justify-content:center;gap:14px;margin:14px 0}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.dots.err{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pad{display:grid;grid-template-columns:repeat(3,60px);gap:10px 22px;justify-content:center}
.pad button{width:60px;height:60px;border-radius:50%;background:var(--soft);font-size:23px}
.pad button.x{background:none;font-size:14px}
.pmsg{min-height:22px;margin-top:10px;font-size:14px;color:#D9534F;font-weight:700}

#lb{background:rgba(0,0,0,.9);flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center;z-index:80}
#lb .ph{width:min(560px,90%);aspect-ratio:4/3;border-radius:10px;font-size:14px}
#lb p{margin-top:14px;font-size:15px}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 20px));background:rgba(255,255,255,.97);color:var(--ink);padding:11px 14px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:14px;z-index:95;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.on{animation:tdrop .25s ease-out}@keyframes tdrop{from{transform:translate(-50%,-14px);opacity:0}}
.toast.on{display:block}.toast.tap{cursor:pointer}

@media (max-width:899px){
  #app{grid-template-columns:minmax(0,1fr)}
  #room{position:absolute;inset:0;z-index:20;transform:translateX(100%);transition:transform .22s ease-out}
  body.inroom #room{transform:none}
  .back{display:flex}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hint{padding:18px 20px;font-size:14px;color:var(--ink2)}
.addb{font-size:12.5px;color:#fff;background:var(--green);border-radius:12px;padding:2px 10px;flex:none}
.cv{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--green);border-radius:9px;padding:1px 7px;margin-right:5px;vertical-align:1px}
.tobot{position:absolute;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#333;box-shadow:0 2px 10px rgba(0,0,0,.22);display:none;align-items:center;justify-content:center;z-index:5;cursor:pointer}
.tobot.on{display:flex}.tobot.new::after{content:'';position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid #fff}
#room.searching .tobot{display:none}#rfoot{display:contents}
.qr{display:flex;flex-direction:column;gap:6px;padding:10px 10px;background:#fff;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.qr button{border:1.5px solid var(--green);border-radius:14px;padding:9px 14px;text-align:left;font-size:15px;background:#F3FBF2}
.qr small{display:block;font-size:12.5px;color:var(--ink2)}
.bub.typing{display:flex;gap:4px;padding:12px 14px}
.bub.typing i{width:7px;height:7px;border-radius:50%;background:#A8B4C0;animation:tp 1s infinite}
.bub.typing i:nth-child(2){animation-delay:.15s}.bub.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3}30%{opacity:1}}
.sys .cb{display:flex;align-items:center;gap:4px;margin:6px auto 0;background:#fff;border-radius:14px;padding:4px 12px;font-size:13px;color:var(--green);font-weight:700}
.sys .cb .ms{font-size:18px}
#call{background:linear-gradient(180deg,#2E3B4E,#1B2431);color:#fff;z-index:85;align-items:center;justify-content:center}
.cin,.con{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:420px;padding:40px 24px;height:100%;justify-content:center}
.cav{width:120px;height:120px;border-radius:50%;font-size:12px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.5);margin-bottom:10px}
.cin b,.con b{font-size:24px}.cin span,.con #ctm{font-size:14px;opacity:.85}
.cbtns{display:flex;gap:70px;margin-top:auto;padding-bottom:30px}
.cbtns button{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-size:13px}
.cbtns button .ms{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:visible}
.cbtns .no .ms{background:#E5534B}.cbtns .yes .ms{background:var(--green)}
.csub{min-height:110px;margin-top:30px;text-align:center;width:100%}
.csub p{font-size:17px;line-height:1.6}.csub small{display:block;font-size:14px;opacity:.8;margin-top:4px}
.csub p.me{color:#C8F2B4}
.copts{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:16px}
.copts button{background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:11px 14px;text-align:left;font-size:15px}
.copts small{display:block;font-size:12.5px;opacity:.8}
.cend{margin-top:auto;margin-bottom:30px;width:68px;height:68px;border-radius:50%;background:#E5534B;color:#fff;display:flex;align-items:center;justify-content:center}
.cend .ms{font-size:32px}
#start{background:#fff;align-items:center;justify-content:center;z-index:95}
.stin{width:100%;max-width:360px;padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.stin .logo{width:76px;height:76px;border-radius:22px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}.stin .logo .ms{font-size:44px}
.stin h2{font-size:22px;margin-top:6px}.stin p{font-size:14px;color:var(--ink2)}
.stin input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:17px;outline:none;margin-top:10px;text-align:center}
.stin input:focus{border-color:var(--green)}
.stin button{width:100%;background:var(--green);color:#fff;border-radius:12px;padding:13px;font-size:16px;font-weight:700}
.stin .ld{background:none;color:var(--ink2);font-weight:400;font-size:14px}
#dbg{position:absolute;right:8px;top:64px;opacity:.9;z-index:99;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:8px 10px;border-radius:10px;max-width:360px;line-height:1.6}
#dbg:empty{display:none}
#dbg button{background:#fff;color:#000;border-radius:6px;padding:1px 6px;margin-left:4px;font-size:12px}
.hrt{color:#E5536F;font-size:13px;letter-spacing:1px;font-weight:400}
.pf-aff{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:10px}.pf-aff .hrt{font-size:18px}.pf-aff small{font-size:13px;color:var(--ink2)}

function gamePush(room,it,at){
  gbAll();const x=it[0],g=it[2],kind=it[3]||'share';
  if(kind==='top'){const t=gTop(g,x);const tv=t?t[1]:GB0[g][x];S.gb[g][x]=GAMES[g].low?tv-3:tv+1}
  S.gu[g]=1;
  push(room,{f:x,game:g,gk:kind==='top'?'share':kind,gs:S.gb[g][x],t:hhmm(),d:simDate(curDay()),at});
}
function gameTick(){
  try{chTick()}catch(e){console.error(e)}
  if(!S.name||VIEW)return;gbAll();S.gf=S.gf||{};S.gd=S.gd||{};S.rv=S.rv||{};
  const day=curDay(),slot=curSlot();
  /* 기록 다시 넘기 */
  for(const k of Object.keys(S.rv)){const r=S.rv[k];if(gSlotIdx()<r.due)continue;const room='dm_'+r.who;if(S.pending[room])continue;
    const g=r.g,mine=S.my[g];delete S.rv[k];if(mine==null)continue;
    let nv=mine+gStep(g);if(g==='bat'&&nv>10)continue;if(g==='react'&&nv<150)continue;
    S.gb[g][r.who]=nv;S.rvc=S.rvc||{};S.rvc[r.who+g]=(S.rvc[r.who+g]||0)+1;
    const seq=GR_RIVAL[r.who][Math.min(S.rvc[r.who+g],2)-1];
    run(room,[['@pause',4000],...seq],true);S.gd[day]=(S.gd[day]||0)+1;return}
  try{fortTick(day,slot)}catch(e){}
  if((S.gd[day]||0)>=3)return;
  for(const ev of GAME_EV){
    if(S.gf[ev.id])continue;
    if(ev.day>day||(ev.day===day&&ev.slot>slot))continue;
    if(ev.day<day-1){S.gf[ev.id]=1;continue}
    const room=ev.room==='grp'?'grp':'dm_'+ev.who;
    if(ev.room==='grp'){if(!S.joinedGrp)continue}else if(!S.friends.includes(ev.who)||stage(ev.who)<ev.st)continue;
    if(S.pending[room]||busy())continue;
    S.gf[ev.id]=1;S.gd[day]=(S.gd[day]||0)+1;run(room,[['@pause',6000],...seqSub(ev.seq)],true);return;
  }
}

  S.gr=S.gr||{};const dk=room+g+curDay();const first=!S.gr[dk];S.gr[dk]=1;
  let lines,aff={};
  if(room==='grp'){
    const top=gTop(g,null);const b=gBucket(g,score,top?top[1]:null);
    lines=GR_GRP[g][b];const o=GAMES[g].owner;if(first)aff[o]=b==='beat'?2:1;
    if(b==='beat'&&top&&GR_RIVAL[top[0]])gRival(top[0],g);
  }else{
    const x=room.slice(3);const ref=S.gb[g][x];const b=gBucket(g,score,ref);
    lines=(GAMES[g].owner===x?GR_OWN[x]:GR_GEN[x])[b];

    if(b==='beat'&&GR_RIVAL[x]&&GAMES[g].owner===x)gRival(x,g);
  }
  if(!first)lines=lines.slice(0,1);
  run(room,[['@pause',1800],...lines],true);
  if(Object.keys(aff).length)setTimeout(()=>{gain(aff);save()},3500);
  save();renderAll();
}

/* ===== 사인 외우기: 네온 패드 ===== */
sign(){
  const st=$('gstage');const cols=['#FF5C7A','#3FA9FF','#FFC93C','#3EDC8B'],tone=[330,392,494,587];
  const shp=['<circle cx="32" cy="32" r="16"/>','<polygon points="32,13 52,49 12,49"/>','<rect x="15" y="15" width="34" height="34" rx="5"/>','<polygon points="32,10 38,26 55,26 41,36 46,53 32,43 18,53 23,36 9,26 26,26"/>'];
  st.innerHTML=`<div class="gsign"><div class="gsg-top"><div class="gsg-rnd"><small>ROUND</small><b id="gsr">1</b></div><div class="gsg-msg" id="gsm">よく見て</div><div class="gsg-dots" id="gsd"></div></div><div class="gpads">${cols.map((c,i)=>`<button data-i="${i}" style="--c:${c}"><svg viewBox="0 0 64 64" fill="currentColor">${shp[i]}</svg></button>`).join('')}</div></div>`;
  const pads=[...st.querySelectorAll('.gpads button')];let seq=[],pos=0,input=false,alive=true;gScore(0);
  const dots=()=>{$('gsd').innerHTML=seq.map((_,i)=>`<i class="${i<pos?'f':''}"></i>`).join('')};
  const flash=(i,ms)=>{pads[i].classList.add('on');beep(tone[i],ms/1000,'triangle',0.08);setTimeout(()=>pads[i].classList.remove('on'),ms)};
  function round(){if(!alive)return;seq.push(Math.floor(Math.random()*4));pos=0;input=false;$('gsr').textContent=seq.length;const m=$('gsm');m.textContent='よく見て';m.className='gsg-msg';dots();st.querySelector('.gsign').classList.remove('turn');
    const on=Math.max(230,460-seq.length*18),gap=Math.max(90,170-seq.length*6);let k=0;
    (function nx(){if(!alive)return;if(k>=seq.length){input=true;m.textContent='あなたの番';m.className='gsg-msg you';st.querySelector('.gsign').classList.add('turn');return}flash(seq[k],on);k++;setTimeout(nx,on+gap)})()}
  pads.forEach(p=>p.addEventListener('pointerdown',e=>{e.preventDefault();if(!input)return;const i=+p.dataset.i;flash(i,170);
    if(i!==seq[pos]){input=false;alive=false;st.querySelector('.gsign').classList.add('bad');gShake(2);beep(110,0.4,'sawtooth',0.05);$('gsm').textContent='ミス!';$('gsm').className='gsg-msg bad';setTimeout(()=>gEnd(seq.length-1),1000);return}
    pos++;dots();if(pos>=seq.length){input=false;gScore(seq.length);$('gsm').textContent='NICE';$('gsm').className='gsg-msg ok';setTimeout(round,700)}}));
  GM.stop=()=>{alive=false};setTimeout(round,700);
},
/* ===== 반응속도: 타깃 ===== */
react(){
  const st=$('gstage');st.innerHTML=`<div class="greact" id="grx"><div class="grt-ring"><div class="grt-core"><b id="grt">READY</b><small id="grs"></small></div></div><p id="grp">초록색이 되는 순간 탭</p><div class="grl" id="grl">${'<span></span>'.repeat(5)}</div></div>`;
  const box=$('grx');let state='wait',times=[],tid=null,goT=0,alive=true;
  const grade=ms=>ms<200?'번개':ms<240?'이즈루급':ms<280?'빠름':ms<330?'보통':'느긋';
  function chips(){$('grl').innerHTML=Array.from({length:5},(_,i)=>`<span class="${times[i]?'f':''}">${times[i]||''}</span>`).join('')}
  function arm(){state='wait';box.className='greact wait';$('grt').textContent='WAIT';$('grs').textContent=`${times.length+1} / 5`;$('grp').textContent='아직이에요';tid=setTimeout(()=>{if(!alive)return;box.className='greact go';$('grt').textContent='TAP!';$('grp').textContent='';requestAnimationFrame(()=>{goT=performance.now();state='go'})},1200+Math.random()*2300)}
  box.addEventListener('pointerdown',e=>{e.preventDefault();if(!alive)return;
    if(state==='wait'){clearTimeout(tid);state='early';box.className='greact early';$('grt').textContent='FAULT';$('grs').textContent='フライング';$('grp').textContent='다시 할게요';gShake(1);beep(120,0.25,'sawtooth',0.05);setTimeout(arm,1200);return}
    if(state==='go'){const ms=Math.max(80,Math.round(performance.now()-goT));times.push(ms);state='show';box.className='greact show';$('grt').textContent=ms;$('grs').textContent=`ms · ${grade(ms)}`;beep(880,0.08,'triangle',0.06);chips();
      if(times.length>=5){alive=false;const avg=Math.round(times.reduce((a,b)=>a+b,0)/5);$('grp').textContent=`평균 ${avg}ms`;gScore(avg);setTimeout(()=>gEnd(avg),1100)}else $('grp').textContent='탭해서 다음';
      return}
    if(state==='show')arm()});
  chips();GM.stop=()=>{alive=false;clearTimeout(tid)};arm();
}
};

  else{const x=room.slice(3);
    if(id==='love'){const xr=T.ch[x];const rel=xr===r?'same':T.r[r].m===xr?'match':'other';lines=TR_DM.love[x][rel];if(first)aff[x]=rel==='match'?2:1}

  if(type==='name'&&key==='res'){m.who=it[4];m.sc=nameScore(it[4])}

  push(room,m)}
function subX(lines,X,Sc){return lines.map(l=>[l[0]==='{X}'?X:l[0],l[1].replace(/\{XJ\}/g,KN[X]||'').replace(/\{S\}/g,Sc),l[2].replace(/\{XK\}/g,nm(X)).replace(/\{S\}/g,Sc)])}
function seqSub(seq){return seq.map(l=>Array.isArray(l)&&typeof l[1]==='string'?l.map((v,i)=>i>0&&typeof v==='string'?v.replace(/\{S\}/g,nameScore('j')):v):l)}

function fortTick(day,slot){if(!S.joinedGrp||day<2||slot>1||!FORT_C[day])return;S.fd=S.fd||{};if(S.fd[day]||S.pending.grp||busy())return;S.fd[day]=1;
  run('grp',[['@pause',5000],['c','@app','fort',String(day)],...FORT_C[day][1]],true)}
function myFort(day){const h=hsh2(S.name+'|f|'+day);let st=1+h%5,love=1+(h>>3)%5;if(day===7)love=5;if(day===10){st=5}
  const pool=S.friends.length?S.friends:IDS;let lucky=pool[(h>>6)%pool.length];if(day===7&&S.friends.length)lucky=[...S.friends].sort((a,b)=>S.aff[b]-S.aff[a])[0];
  const it=LUCKY_ITEM[(h>>9)%LUCKY_ITEM.length];return {st,love,lucky,it,msg:FORT_MSG[st],work:1+(h>>12)%5}}

 {id:'s05',g:0,s:1,m:['@pic','손글씨 메모, 준비물 목록(장갑, 미끄럼 방지 신발, 핫팩, 긴 우산)',

 {id:'s08',g:0,s:1,m:['キャリーケース、タイヤでかいやつにしとけ','캐리어는 바퀴 큰 걸로 가져와',

 {id:'s09',g:0,s:2,after:'s01',m:['予報変わった。入村日、夕方から雨','예보 바뀌었어. 입촌 날 저녁부터 비래',
  ['傘、持っていきます','우산 챙길게요',1,'折りたたみじゃ無理。風あるから長いやつな','접이식은 안 돼. 바람 부니까 긴 걸로'],

 {id:'s10',g:0,s:0,m:['コウが言う集合時間、信じすぎんなよ','코우가 말하는 집합 시간, 너무 믿지 마',

 {id:'s11',g:1,s:0,m:['起きてるか。今朝こっちマイナスだぞ','일어났냐. 오늘 아침 여기 영하다',

 {id:'s13',g:1,s:1,m:['昼、カレー。ヒイラギに付き合わされた','점심은 카레. 히이라기한테 끌려갔어',

  ['壁、叩いてみたらどうですか','벽 한번 두드려 보는 건 어때요?',2,'叩いた。三回。余計うるさくなった','두드렸어. 세 번. 더 시끄러워졌어']]},

 {id:'s24',g:1,s:3,m:['イズルがまだ泳いでる','이즈루 아직도 수영하고 있어',
  ['止めないんですか','안 말려요?',1,'言っても聞かねぇんだよ、あいつ','말해도 안 들어, 그 녀석'],
  ['セイヤさん、見てたんですか','세이야 씨, 보고 있었어요?',2,'たまたまだよ。通りかかっただけだし、別に心配とかじゃなくて、プールの電気ついてたから気になって、いや電気代の話な','우연이야. 지나가다 본 거고, 딱히 걱정돼서 그런 게 아니라 수영장 불이 켜져 있길래 신경 쓰여서, 아니 전기세 얘기야']]},

  ['気づかなかったんですか?','몰랐어요?',2,'朝、二十八度って出てて、半袖で出るとこだった。いや、出てねぇ。窓見りゃ分かるし。普通に分かってたし','아침에 28도라고 떠서 반팔로 나갈 뻔했어. 아니, 안 나갔어. 창문 보면 알잖아. 당연히 알고 있었고'],

 {id:'s33',g:2,s:2,m:['コウと口論した','코우랑 말다툼했어',

 {id:'h07',g:0,s:0,m:['村の決まりで、よく聞かれることを一つ。朝の点呼はありません。ただ、朝ごはんに顔を出さないと、コウさんが部屋まで来ます','촌 규칙 중에 자주 듣는 질문 하나요. 아침 점호는 없어요. 대신 아침밥에 안 나타나면 코우 씨가 방까지 찾아와요',
  ['本当に来るんですか?','진짜 찾아와요?',2,'来ます。ノックが三回で、四回目は名前を呼ばれます','와요. 노크 세 번 하고, 네 번째엔 이름 불러요'],
  ['気をつけます','조심할게요',1,'はい。朝ごはんだけ出れば大丈夫です','네. 아침만 나가면 괜찮아요']]},
 {id:'h08',g:0,s:1,m:['体育館の見学のことです。外の人は受付が要りますが、入村した後なら、僕と一緒なら入れます','체육관 견학 얘기예요. 외부 사람은 접수가 필요한데, 입촌한 뒤엔 저랑 같이면 들어갈 수 있어요',
  ['見てみたいです','보고 싶어요',2,'分かりました。受付の人に、条件を確認しておきます','알겠어요. 접수처에 조건 확인해 둘게요'],
  ['そうなんですね','그렇구나',1,'はい。必要になったら言ってください','네. 필요해지면 말씀하세요']]},
 {id:'h09',g:0,s:2,after:'h03',m:['渡り廊下の地図、送りました。一つ足しておくと、あそこは外の風が入るので、夜はそこだけ寒いです','연결 복도 지도 보냈어요. 하나 덧붙이면, 거긴 바깥바람이 들어와서 밤엔 거기만 추워요',
  ['上着、一枚持っていきます','겉옷 하나 챙겨 갈게요',2,'それがいいです。僕らは走って通ります','그게 좋아요. 저희는 뛰어서 지나가요'],
  ['分かりました','알겠어요',1,'以上です','이상이에요']]},
 {id:'h10',g:0,s:0,m:['朝の食堂で、一つだけ注意です。ゲンタさんの隣に座ると、頼んでないおかわりを勝手に盛られます','아침 식당에서 딱 하나 주의할 게 있어요. 겐타 씨 옆에 앉으면 부탁도 안 한 리필을 막 퍼 줘요',
  ['本当ですか笑','진짜요ㅋㅋ',2,'本当です。僕は毎朝やられてます','진짜예요. 전 매일 아침 당해요'],
  ['覚えておきます','기억해 둘게요',1,'端の席なら安全です','끝자리면 안전해요']]},

 // g1 아는 사이: 선수 일상이 조금씩
 {id:'h11',g:1,s:0,after:'h07',m:['おはようございます。今朝、本当にコウさんがイツキさんの部屋をノックしてました。四回目で起きてました','좋은 아침이에요. 오늘 아침에 진짜로 코우 씨가 이츠키 씨 방 노크하더라고요. 네 번째에 일어났어요',
  ['言ってた通りですね','말한 그대로네요',2,'はい。僕は朝練の帰りに見ました。今日は着地だけで一時間です','네. 저는 아침 운동 끝나고 오다가 봤어요. 오늘은 착지만 한 시간 했어요'],
  ['イツキさん、大変ですね','이츠키 씨 힘들겠네요',1,'毎週のことなので、本人は気にしてないです','매주 있는 일이라 본인은 신경 안 써요']]},
 {id:'h12',g:1,s:0,m:['おはようございます。今日は午前ずっと床です','좋은 아침이에요. 오늘은 오전 내내 마루예요',
  ['床って、マット運動みたいな感じですか?','마루면 매트 운동 같은 거예요?',2,'近いです。12メートル四方を使って、跳んで回って、一人で70秒。見た目より脚にきます','비슷해요. 12미터 정사각형 안에서 뛰고 돌고, 혼자 70초요. 보기보다 다리에 와요'],
  ['いってらっしゃい','다녀오세요',1,'いってきます','다녀올게요']]},
 {id:'h13',g:1,s:0,m:['5時半の体育館、まだ暖房が効いてないです。手が冷たいと、チョークがうまく馴染まないんです','5시 반 체육관은 아직 난방이 안 돌아요. 손이 차가우면 초크가 잘 안 먹어요',
  ['チョークって、手に付ける白い粉ですか?','초크면 손에 바르는 하얀 가루요?',2,'それです。滑り止めです。床ではあまり使いませんが、つり輪の日は必須です','그거예요. 미끄럼 방지요. 마루에선 별로 안 쓰는데, 링 하는 날은 필수예요'],
  ['朝から大変ですね','아침부터 고생이네요',1,'慣れてます。手をこすって温めてから始めます','익숙해요. 손 비벼서 데우고 시작해요']]},
 {id:'h14',g:1,s:0,m:['事務局の名簿、また僕の性別が「女」になってました','사무국 명단에 또 제 성별이 "여"로 돼 있었어요',
  ['名前のせいですか?','이름 때문이에요?',2,'はい、これで三回目です。直してもらうついでに、{N}さんの入村日の表記も合ってるか見てもらいました','네, 벌써 세 번째예요. 고쳐 달라고 하는 김에 {N} 씨 입촌일 표기도 맞는지 봐 달라고 했어요'],
  ['実は私も最初、女性だと思ってました','사실 저도 처음엔 여자분인 줄 알았어요',1,'よく言われます。でも、もう間違えないですよね','자주 들어요. 그래도 이제 안 헷갈리시죠?']]},
 {id:'h15',g:1,s:1,after:'h08',m:['見学の件、受付で確認してきました。入村した週から大丈夫です。午後の方が、通し練習が見られます','견학 건 접수처에서 확인하고 왔어요. 입촌한 주부터 괜찮대요. 오후에 오면 통으로 하는 연습을 볼 수 있어요',
  ['覚えててくれたんですね','기억하고 있었네요',2,'確認すると言ったので','확인한다고 했으니까요'],
  ['ありがとうございます','감사해요',1,'いえ。その時は声をかけてください','아니에요. 그때 말씀만 해 주세요']]},
 {id:'h16',g:1,s:1,after:'h06',m:['前に送った「誰に何を聞くか」、一人追加です。髪のことはイツキさん。僕は全然分からないので','전에 보낸 "누구한테 뭘 묻나"에 한 명 추가요. 머리 관련은 이츠키 씨. 저는 하나도 몰라서요',
  ['イツキさんって、そういうの詳しいんですか?','이츠키 씨가 그런 거 잘 알아요?',2,'詳しいです。僕の前髪も、たまに勝手に切られます','잘 알아요. 제 앞머리도 가끔 멋대로 잘라요'],
  ['追加しておきます','추가해 둘게요',1,'はい。他にも出てきたら、足します','네. 또 생기면 추가할게요']]},
 {id:'h17',g:1,s:1,m:['午前は跳馬に混ぜてもらいました。床の選手も、たまにやるんです。踏み切りの感覚が近いので','오전엔 도마 연습에 껴서 했어요. 마루 선수도 가끔 해요. 구름판 밟는 감각이 비슷해서요',
  ['跳馬って、台を跳び越えるやつですか?','도마면 뜀틀 넘는 거요?',2,'そうです。走って、踏み切って、手をついて、回って着地。全部で数秒です','맞아요. 달려서 구르고, 손 짚고, 돌아서 착지. 다 해서 몇 초예요'],
  ['いろいろやるんですね','이것저것 다 하네요',1,'メインは床です。他は、そのための練習です','메인은 마루예요. 나머진 그걸 위한 연습이고요']]},
 {id:'h18',g:1,s:1,m:['ゲンタさんに「チビ、届くか?」と言われながら、上の棚のマットを下ろしました。もう僕の方が手が長いんですけど','겐타 씨가 "꼬맹아, 닿냐?" 하는 와중에 위 선반 매트 내렸어요. 이제 제 팔이 더 긴데요',
  ['届いたんですか?','닿았어요?',2,'届きました。背伸びもしてないです','닿았죠. 까치발도 안 들었어요'],
  ['ゲンタさん、相変わらずですね','겐타 씨 여전하네요',1,'背が伸びても、呼び方だけは高校の時のままです','키가 커도 부르는 건 고등학교 때 그대로예요']]},
 {id:'h19',g:1,s:2,m:['夕飯、イズルさんの隣で食べました。一言もしゃべらなかったですけど、それが落ち着くんです','저녁은 이즈루 씨 옆에서 먹었어요. 한마디도 안 했는데, 그게 편해요',
  ['仲がいいんですね','사이좋네요',1,'高校の時から、ずっとこんな感じです','고등학교 때부터 쭉 이래요'],
  ['イズルさんらしいですね','이즈루 씨답네요',2,'ですね。黙ってても、周りをちゃんと見てる人なので','그쵸. 말은 없어도 주변을 잘 보는 사람이라서요']]},
 {id:'h20',g:1,s:2,m:['夕方のトレーニング、体幹だけで40分でした。今、階段がつらいです','저녁 트레이닝, 코어만 40분 했어요. 지금 계단이 힘들어요',
  ['お疲れさまです','수고했어요',1,'ありがとうございます。明日には戻ります','고마워요. 내일이면 괜찮아져요'],
  ['体幹だけで40分ですか?','코어만 40분이요?',2,'床は、空中で体がぶれたら終わりなので。地味ですけど、一番大事な練習です','마루는 공중에서 몸이 흔들리면 끝이라서요. 티는 안 나도 제일 중요한 연습이에요']]},
 {id:'h21',g:1,s:2,after:'h12',m:['今日、床の通しをコーチに採点してもらいました。13.9です。試合までに14を超えたいです','오늘 마루 통으로 한 거 코치님이 점수 매겨 줬어요. 13.9예요. 시합 전까지 14 넘기고 싶어요',
  ['あと少しですね','조금만 더 하면 되네요',2,'はい。着地を一つ止められれば、届く点数です','네. 착지 하나만 딱 세우면 닿는 점수예요'],
  ['試合があるんですか?','시합 있어요?',1,'12月の頭に、国内の選考会があります','12월 초에 국내 선발전이 있어요']]},
 {id:'h22',g:1,s:3,m:['夜分すみません。手首のテーピングを巻き直してたら、こんな時間でした','밤늦게 죄송해요. 손목 테이핑 다시 감다 보니 이 시간이 됐어요',
  ['痛めてるんですか?','다쳤어요?',2,'痛くはないです。予防です。床は手首で体重を受けるので','아프진 않아요. 예방이에요. 마루는 손목으로 체중을 받아서요'],
  ['遅くまでお疲れさまです','늦게까지 수고했어요',1,'ありがとうございます。もう寝ます','고마워요. 이제 잘게요']]},
 {id:'h23',g:1,s:3,m:['寝る前のストレッチ中です。開脚は毎晩やらないと、すぐ固くなるので','자기 전에 스트레칭 하는 중이에요. 다리 찢기는 매일 밤 안 하면 금방 굳어서요',
  ['毎晩ですか?','매일 밤이요?',2,'高校からずっとです。一日休むと、戻すのに三日かかります','고등학교 때부터 쭉요. 하루 쉬면 되돌리는 데 사흘 걸려요'],
  ['私は全然曲がらないです','저는 하나도 안 굽혀져요',1,'最初はみんなそうです。じゃあ、おやすみなさい','처음엔 다 그래요. 그럼 잘 자요']]},
 {id:'h24',g:1,s:3,m:['ゲンタさんのいびきが壁越しに聞こえてきます。{N}さんの部屋はイツキさんの隣なので、静かなはずです','겐타 씨 코 고는 소리가 벽 너머로 들려요. {N} 씨 방은 이츠키 씨 옆이라 조용할 거예요',
  ['それは安心です','그럼 안심이네요',2,'イツキさんは寝てる時だけ静かなので','이츠키 씨는 잘 때만 조용하거든요'],
  ['眠れますか?','잠은 와요?',1,'もう慣れました。合宿よりはましです','이제 익숙해요. 합숙 때보단 나아요']]},

 {id:'h27',g:2,s:0,m:['@pic','새벽 체조장, 불 하나만 켜진 빈 마루 매트',
  ['一番乗りですね','1등으로 왔네요',2,'この時間の床が一番好きです。自分の着地の音しかしないので','이 시간 마루가 제일 좋아요. 제 착지 소리밖에 안 나서요'],
  ['寒くないですか?','안 추워요?',1,'寒いです。でも一本目を跳んだら忘れます','추워요. 근데 한 번 뛰고 나면 잊어버려요']]},
 {id:'h28',g:2,s:1,m:['@pic','체조장, 공중에서 다리를 쭉 편 순간',

  ['足先まできれいですね','발끝까지 예쁘네요',2,'そこを見てもらえるのは、正直嬉しいです。一番減点されやすいところなので','거길 봐 주는 건 솔직히 좋네요. 제일 감점 잘 되는 데라서요']]},
 {id:'h29',g:2,s:1,m:['ゲンタさんに、またチビって言われました','겐타 씨가 또 꼬맹이래요',

  ['仲いいですね','사이좋네요',1,'まあ、長い付き合いなので','뭐, 오래 알았으니까요']]},
 {id:'h30',g:2,s:1,m:['お昼、セイヤさんと来ました。午後に跳馬があるので、うどんで軽めです。{N}さんは何食べますか?','점심 먹으러 세이야 씨랑 왔어요. 오후에 도마 있어서 우동으로 가볍게요. {N} 씨는 뭐 먹어요?',
  ['まだ決めてないです','아직 안 정했어요',1,'温かいものにしてください。今日は冷えるので','따뜻한 거 먹어요. 오늘 쌀쌀하대요'],
  ['ヒイラギさんと同じうどんにします','히이라기 씨랑 같은 우동 먹을래요',2,'じゃあ、おそろいですね','그럼 우리 똑같네요']]},
 {id:'h31',g:2,s:2,m:['@pic','태블릿 속 마루 연기 영상, 착지 순간에 멈춘 화면',
  ['かっこいいです','멋있어요',1,'ありがとうございます。でも、この画面で止めたのは反省用です。半歩、出てるので','고마워요. 근데 이 장면에서 멈춘 건 반성용이에요. 착지 때 발이 반 발 나갔거든요'],
  ['どこが気になるんですか?','어디가 마음에 걸려요?',2,'右足です。半歩前に出てます。{N}さんに送るつもりで見たら、自分で気づけました','오른발이요. 반 발 앞으로 나갔어요. {N} 씨한테 보낼 생각으로 보니까 제가 알아챘네요']]},
 {id:'h32',g:2,s:2,after:'h21',m:['点数、14.1まで上がりました。着地、一つ止まりました','점수 14.1까지 올랐어요. 착지 하나 세웠어요',
  ['14超えましたね!','14 넘었네요!',2,'はい。真っ先に{N}さんに言おうと思ってました','네. 제일 먼저 {N} 씨한테 말하려고 했어요'],

function run(room,seq,live,ev){
  room=roomOf(room);let at=Math.max(now(),...(S.log[room]||[]).map(m=>m.at||0));
  for(let i=0;i<seq.length;i++){
    const it=seq[i];const k=it[0];
    if(k==='@pause'){if(live)at+=room==='grp'?it[1]*0.8:it[1];continue}
    if(k==='@sys'){push(room,{f:'sys',jp:sub(it[1]),t:hhmm(),d:simDate(curDay()),at});continue}
    if(k==='@choice'){S.pending[room]={opts:it[1],rest:seq.slice(i+1),at,live};return}
    if(k==='@invite'){if(live)at+=1500;push(room,{f:room.slice(3),invite:'grp',t:hhmm(),d:simDate(curDay()),at});continue}
    if(k==='@friend'){addFriend(it[1],live,true);continue}
    if(k==='@friendP'){S.aff[S.partner]+=3;if(!S.friends.includes(S.partner))addFriend(S.partner,live,true);continue}
    if(k==='@partner'){const pl=PARTNER_LINE[S.partner];for(const x of pl){if(x[0]==='@pause'){if(live)at+=x[1];continue}if(live)at+=delay(x[0],x[2],room);push(room,{f:x[0],jp:sub(x[1],'jp'),kr:sub(x[2]),t:hhmm(),d:simDate(curDay()),at})}continue}
    if(k==='@call'||k==='@callP'){const who=k==='@callP'?S.partner:it[1];startIncoming(who,live,at);continue}
    if(it[1]==='@game'){if(live)at+=delay(k,'',room);gamePush(room,it,at);continue}
    if(it[1]==='@app'){if(live)at+=delay(k,'',room);appPush(room,it,at);continue}
    if(it[1]==='@test'){if(live)at+=delay(k,'',room);testPush(room,it,at);continue}
    if(live)at+=delay(k,it[2],room);
    if(it[1]==='@st')push(room,{f:k,st:it[2],t:hhmm(),d:simDate(curDay()),at});
    else if(it[1]==='@pic')push(room,{f:k,pic:it[2],t:hhmm(),d:simDate(curDay()),at});
    else push(room,{f:k,jp:sub(it[1],'jp'),kr:sub(it[2]),t:hhmm(),d:simDate(curDay()),at});
  }
}

function stage(x){const a=S.aff[x]||0;return a>=STAGE[2]?3:a>=STAGE[1]?2:a>=STAGE[0]?1:0}
function iniCnt(x){S.ini=S.ini||{};return S.ini[x+'-'+curDay()]||0}

function tStage(t){return t.min>=20?3:t.min>=12?2:t.min>=5?1:0}

function topicToday(x){S.dc=S.dc||{};return S.dc[x+'-'+curDay()]||0}
function nextRoutine(x,slot){
  if(gated(x))return null;S.rtDone=S.rtDone||{};const g=stage(x);

  if(!ok.length)return null;ok.sort((a,b)=>b.g-a.g);return ok[0];
}
function rtSeq(x,r){
  const head=r[0]==='@pic'?[x,'@pic',r[1]]:[x,r[0],r[1]];
  const op=a=>({jp:a[0],kr:a[1],aff:{[x]:a[2]},then:[a[3]==='@st'?[x,'@st',a[4]]:[x,a[3],a[4]]]});

/* 지금 이 캐릭터가 먼저 연락할 이유가 있는가: 예산, 시간대 중복, 보낼 내용 */
function canReach(x,slot,late){
  if(!S.friends.includes(x)||!freeDm(x)||gated(x))return null;
  if(iniCnt(x)>=BUDGET[stage(x)]+(late?1:0)||iniSlot(x,late?4:slot)>=1)return null;
  if(stage(x)>0&&topicToday(x)<1&&nextTopic(x))return 'topic';
  if(nextRoutine(x,slot))return 'routine';
  if(topicToday(x)<1&&nextTopic(x))return 'topic';
  return null;
}
function reach(x,slot,wait,late){
  const kind=canReach(x,slot,late);if(!kind)return false;markIni(x,late?4:slot);
  if(kind==='topic'){S.dc=S.dc||{};S.dc[x+'-'+curDay()]=topicToday(x)+1;const t=nextTopic(x);S.tIdx[x]=(S.tIdx[x]||0)+1;setTimeout(()=>{run('dm_'+x,[['@pause',wait||0],...t.seq],true);save();renderAll()},50)}
  else{const r=nextRoutine(x,slot);S.rtDone[r.id]=1;setTimeout(()=>{run('dm_'+x,[['@pause',wait||0],...rtSeq(x,r.m)],true);save();renderAll()},50)}

}
/* 누가 연락할지: 호감도 높은 순, 같으면 오늘 연락 적은 순. 랜덤 아님 */
function reachOrder(slot){return S.friends.filter(x=>canReach(x,slot)).sort((a,b)=>(S.aff[b]-S.aff[a])||(iniCnt(a)-iniCnt(b))||(hsh(a+curDay())-hsh(b+curDay())))}

/* b=그날 저녁 기준 분(1440 넘으면 자정 이후), r=오차 범위, p=그날 있을 확률(%), dm=개인톡만 */
const SUBS=[{b:19*60+5,r:50,slot:2},{b:20*60+45,r:50,slot:2},{b:23*60,r:55,slot:3},{b:24*60+50,r:85,slot:3,p:65,dm:1}];
function subAt(day,i){return SUBS[i].b+jit(day,10+i,SUBS[i].r)}

function subTick(){
  if(!S.joinedGrp||VIEW||(DEBUG&&S.dbg.day))return;
  const d=new Date(now()),mins=d.getHours()*60+d.getMinutes(),day=curDay(),slot=curSlot();S.sub=S.sub||{};
  const em=mins<300?mins+1440:mins;let due=-1;SUBS.forEach((x,i)=>{if(x.slot===slot&&subOn(day,i)&&em>=subAt(day,i))due=i});if(due<0)return;
  if(S.sub[day+'-'+due]||S.incoming)return;for(let i=0;i<=due;i++)S.sub[day+'-'+i]=1;

  const sent=!SUBS[due].dm&&grpFree&&sendChatter(slot,4000,true);const late=!!SUBS[due].dm;const o=S.friends.filter(x=>canReach(x,slot,late)).sort((a,b)=>(S.aff[b]-S.aff[a])||(hsh(a+day)-hsh(b+day))).filter(x=>{const l=S.log['dm_'+x]||[];return !(l.length&&l[l.length-1].at>t)});if(o.length)reach(o[0],slot,sent?40000:4000,late);
}
function nextChatter(slot){S.chUsed=S.chUsed||{};const c=CHATTER.map((v,i)=>[v,i]).filter(([v,i])=>!S.chUsed[i]&&(v.s===slot||v.s===-1));if(!c.length)return null;const ex=c.filter(([v])=>v.s===slot);return (ex.length?ex:c)[0]}

function sendChatter(slot,wait,force){if(!S.joinedGrp)return false;S.chUsed=S.chUsed||{};S.chc=S.chc||{};if(S.pending.grp)return false;if(!force&&chCnt()>=CCAP)return false;const p=nextChatter(slot);if(!p)return false;S.chUsed[p[1]]=1;S.chc[curDay()]=chCnt()+1;setTimeout(()=>{run('grp',[['@pause',wait||0],...p[0].seq],true);save();renderAll()},50);return true}
/* 시간대가 바뀔 때: 그 시간대에 용건 있는 사람 최대 2명 */
function topics(day,slot){
  if(!S.joinedGrp)return;
  const key=`${day}-${slot}`;if(S.tSlot[key])return;S.tSlot[key]=1;
  let n=0;for(const x of reachOrder(slot)){if(n>=2)break;if(S.incoming&&S.incoming.who===x)continue;if(reach(x,slot,8000+15000*n))n++}
  if(slot!==3||n===0)sendChatter(slot,25000);

function ambient(){

}

    const rd=me?rdTxt(m,id,t):'';
    h+=`<div class="mg ${me?'me':''} ${first?'first':''}" id="m${i}">${me?'':`<div class="avw">${first?`<span onclick="openPf('${m.f}')" style="cursor:pointer">${av(m.f,'av s')}</span>`:''}</div>`}<div class="body">${!me&&first?`<div class="nm">${nm(m.f)}</div>`:''}<div class="row">${b}${lastT?`<span class="st">${rd?`<span>${rd}</span>`:''}<span>${ampm(m.t)}</span></span>`:''}</div></div></div>`;
  }

function begin(){const v=$('nmIn').value.trim();if(!v){toast('이름을 입력해 주세요');return}
  S=fresh();S.name=v;S.start=ymdLocal(simBase());S.partner=IDS[Math.floor(Math.random()*IDS.length)];save();$('start').classList.remove('on');tab='home';cur=null;tick();drawList()}

/* ---- misc ---- */
function lb(t,src){const e=$('lbB');e.className='ph imw';e.innerHTML=(src?`<img src="${src}" alt="" onload="this.parentNode.classList.add('ok')" onerror="jpgFb(this)">`:'')+`<span>사진 자리<br>${t}</span>`;$('lbC').textContent=t;$('lb').classList.add('on')}
let tt;function toast(t,room){const e=$('toast');e.textContent=t;e.dataset.r=room||'';e.classList.toggle('tap',!!room);e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),room?4000:3200)}
/* 새 메시지 알림을 누르면 그 대화방으로 */
function toastGo(){const e=$('toast'),r=e.dataset.r;e.classList.remove('on');if(!r||!rooms().includes(r))return;try{if($('game').classList.contains('on'))closeGame();closePf();$('lb').classList.remove('on');$('lsheet').classList.remove('on')}catch(x){}tab='talk';openRoom(r)}
let lastSig='';
function renderAll(){
  const sig=Object.keys(S.log).map(k=>k+visLog(k).length).join()+JSON.stringify(S.pending&&Object.keys(S.pending).map(k=>k+(S.pending[k].at<=now())))+(S.incoming?1:0)+rdSig();
  if(cur&&(document.body.classList.contains('inroom')||innerWidth>=900))S.seen[cur]=now();
  if(sig!==lastSig)drawList();
  if(cur){const nb=nearBot();if(sig!==lastSig&&!$('room').classList.contains('searching'))drawRoom(nb)}
  if(sig!==lastSig){
    if(!VIEW)for(const k in S.log){const v=visLog(k);const l=v[v.length-1];if(l&&l.at>now()-1200&&l.f!=='u'&&l.f!=='sys'&&k!==cur)toast(`${nm(l.f)}: ${pv(l)}`,k)}
  }
  lastSig=sig;showIncoming();drawDbg();
}
function drawDbg(){if(!DEBUG)return;$('dbg').innerHTML=`<b>테스트</b> ${curDay()}일 ${SLOTN[curSlot()]} <button onclick="S.dbg.day=Math.max(1,curDay()-1);save();tick()">-일</button><button onclick="S.dbg.day=Math.min(${LAST_DAY},curDay()+1);save();tick()">+일</button><button onclick="S.dbg.slot=(curSlot()+1)%4;if(S.dbg.slot===0)S.dbg.day=Math.min(${LAST_DAY},curDay()+1);save();tick()">다음 시간대</button><br>${IDS.map(x=>`${nm(x)} ${S.aff[x]}`).join(' / ')}<br>파트너 ${S.partner?nm(S.partner):'-'}`}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('game').classList.contains('on'))closeGame();closePf();$('lb').classList.remove('on')}});
if(!S.name)startScreen();else{tick();drawList()}
setInterval(()=>{tick();ambient()},12000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{renderAll()},700);
</script>
<script>
/* ---- 안드로이드 앱 연결: 알림, 뒤로가기 ---- */
(function(){
const A=window.Android;if(!A)return;
window.IMG_REMOTE='https://raw.githubusercontent.com/snowbls/app/main/app/src/main/assets/img/';
let bgAt=0;const sent={};
function hid(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%900000+100}
function ttl(room,f){const n=nm(f)||'진구칸';return /^dm_/.test(room)||room==='office'?n:n+' (단톡)'}
function who(f){return P[f]&&P[f].lane?f:''}
// 앱을 내려 둔 동안 실제로 도착한 메시지
setInterval(()=>{
  if(!bgAt||!S.name)return;
  for(const k in S.log){const v=visLog(k);const l=v[v.length-1];
    if(!l||l.f==='u'||l.f==='sys'||l.at<=bgAt||sent[k]===l.at)continue;
    sent[k]=l.at;A.post(ttl(k,l.f),pv(l),hid(k),who(l.f),k)}
  if(S.incoming&&S.incoming.at<=now()&&sent.call!==S.incoming.at){sent.call=S.incoming.at;A.post(nm(S.incoming.who),'음성통화가 걸려 왔어요',hid('call'),who(S.incoming.who),'dm_'+S.incoming.who)}
},4000);
// 앱이 꺼져 있어도 다음 시간대 메시지를 미리 알림으로 예약
function dayAt(T){if(!S.start)return 1;const a=new Date(S.start+'T00:00:00'),b=new Date(ymdLocal(new Date(T-5*3600e3))+'T00:00:00');return Math.min(LAST_DAY,Math.max(1,Math.round((b-a)/864e5)+1))}
function firstLine(seq){
  for(const it of seq){const k=it[0];if(typeof k!=='string')continue;
    if(k==='@call'||k==='@callP')return {f:k==='@callP'?S.partner:it[1],b:'음성통화가 걸려 왔어요'};
    if(k==='@friend'||k==='@friendP')return {f:k==='@friendP'?S.partner:it[1],b:'새 메시지가 왔어요'};
    if(k[0]==='@')continue;
    if(it[1]==='@game')return {f:k,b:it[3]==='invite'?'게임 도전장을 보냈습니다.':'게임 기록을 공유했습니다.'};
    if(it[1]==='@test')return {f:k,b:it[3]==='link'?'테스트 링크를 보냈습니다.':'테스트 결과를 공유했습니다.'};
    if(it[1]==='@app')return {f:k,b:{poll:'투표를 올렸습니다.',roul:'룰렛을 올렸습니다.',name:'링크를 보냈습니다.',fort:'오늘의 운세를 공유했습니다.'}[it[2]]||'새 메시지가 왔어요'};
    return {f:k,b:it[1]==='@pic'?'사진을 보냈습니다.':it[1]==='@st'?'스티커를 보냈습니다.':sub(it[2]||it[1])}}
  return null}
function plan(){
  const out=[],t=now();
  for(const k in S.log){const m=(S.log[k]||[]).filter(m=>m.at>t&&m.f!=='u'&&m.f!=='sys').sort((a,b)=>a.at-b.at)[0];if(m)out.push({at:m.at,title:ttl(k,m.f),body:pv(m),id:hid(k),rc:hid('q'+k),who:who(m.f),room:k})}
  const blocked=new Set(Object.keys(S.pending));
  const d=new Date(t);const usedTopic=new Set();
  if(!(DEBUG&&S.dbg.day)){
    for(let dd=0;dd<4;dd++)[0,1,2,3].forEach(slot=>{
      const T=new Date(d.getFullYear(),d.getMonth(),d.getDate()+dd,0,slotMin(dayAt(new Date(d.getFullYear(),d.getMonth(),d.getDate()+dd,12).getTime()),slot),10).getTime();
      if(T<=t||T>t+72*3600e3)return;const day=dayAt(T);if(day>LAST_DAY)return;
      const add=(r,fl,key)=>{if(blocked.has(r))return false;out.push({at:T,title:ttl(r,fl.f),body:fl.b,id:hid(r),rc:hid(key),who:who(fl.f),room:r});return true};
      let dmUsed=false;
      /* 정해진 이벤트 */
      for(const ev of EVENTS){
        if(S.fired[ev.id]||ev.day!==day||ev.slot!==slot)continue;
        if(ev.id==='d2_partner'&&!S.partner)continue;
        if(ev.id!=='d1_daichi'&&!S.joinedGrp)continue;
        try{if(ev.cond&&!ev.cond(S))continue}catch(e){continue}
        const fl=firstLine(ev.seq);if(!fl)continue;
        const r=roomOf(ev.room);if(add(r,fl,'ev'+ev.id)){if(/^dm_/.test(r))dmUsed=true;break}}
      /* 게임·테스트·투표 */
      if(typeof GAME_EV!=='undefined')for(const ev of GAME_EV){
        if(S.gf&&S.gf[ev.id]||ev.day!==day||ev.slot!==slot)continue;
        if(ev.room==='grp'){if(!S.joinedGrp)continue}else if(!S.friends.includes(ev.who)||stage(ev.who)<ev.st)continue;
        const fl=firstLine(ev.seq);if(!fl)continue;
        if(add(ev.room==='grp'?'grp':'dm_'+ev.who,fl,'g'+ev.id))break}
      /* 카이토 아침 운세 */
      if(slot===0&&day>=2&&typeof FORT_C!=='undefined'&&FORT_C[day]&&S.joinedGrp&&!(S.fd&&S.fd[day]))add('grp',{f:'c',b:'오늘의 운세를 공유했습니다.'},'fort'+day);
      /* 그 시간대에 먼저 연락할 친구 (호감도 높은 순) */
      if(!dmUsed&&S.joinedGrp){const cnt=x=>{let n=0;for(const u of usedTopic)if(u.startsWith(x+'|'+day+'|'))n++;return n};const c=[...S.friends].sort((a,b)=>S.aff[b]-S.aff[a]).find(x=>!blocked.has('dm_'+x)&&!gated(x)&&(nextTopic(x)||nextRoutine(x,slot))&&cnt(x)<BUDGET[stage(x)]);
        if(c){usedTopic.add(c+'|'+day+'|'+slot);usedTopic.add(c+'|'+day);add('dm_'+c,{f:c,b:'새 메시지가 왔어요'},'tp'+c+day+slot)}}
    });
    /* 저녁 추가 시각 */
    const chUsed=new Set(Object.keys(S.chUsed||{}).map(Number));const subCnt={};
    for(let dd=0;dd<4;dd++)SUBS.forEach((sb,si)=>{
      const day0=dayAt(new Date(d.getFullYear(),d.getMonth(),d.getDate()+dd,12).getTime());
      const T=new Date(d.getFullYear(),d.getMonth(),d.getDate()+dd,0,subAt(day0,si),10).getTime();
      if(T<=t||T>t+72*3600e3||!S.joinedGrp||!subOn(day0,si))return;const day=dayAt(T);if(day!==day0||day>LAST_DAY||(S.sub&&S.sub[day+'-'+si]))return;
      const add=(r,fl,key)=>{if(blocked.has(r))return;out.push({at:T,title:ttl(r,fl.f),body:fl.b,id:hid(r),rc:hid(key),who:who(fl.f),room:r})};
      if(!sb.dm&&!blocked.has('grp')){const c=CHATTER.map((v,i)=>[v,i]).filter(([v,i])=>!chUsed.has(i)&&(v.s===sb.slot||v.s===-1));const ex=c.filter(([v])=>v.s===sb.slot);const p=(ex.length?ex:c)[0];
        if(p){chUsed.add(p[1]);const fl=firstLine(p[0].seq);if(fl)add('grp',fl,'sc'+day+si)}}
      const cnt=x=>{let n=0;for(const u of usedTopic)if(u.startsWith(x+'|'+day+'|'))n++;return n};
      const sk=sb.dm?4:sb.slot,cap=x=>BUDGET[stage(x)]+(sb.dm?1:0);
      const c2=[...S.friends].sort((a,b)=>S.aff[b]-S.aff[a]).find(x=>!blocked.has('dm_'+x)&&!gated(x)&&(nextTopic(x)||nextRoutine(x,sb.slot))&&cnt(x)<cap(x)&&!usedTopic.has(x+'|'+day+'|'+sk));
      if(c2){usedTopic.add(c2+'|'+day+'|'+sk);add('dm_'+c2,{f:c2,b:'새 메시지가 왔어요'},'st'+c2+day+si)}
    });
  }
  return out.sort((a,b)=>a.at-b.at).slice(0,40)}
window.__onPause=()=>{bgAt=now();try{save()}catch(e){}try{A.schedule(JSON.stringify(plan()))}catch(e){}};
window.__openRoom=r=>{if(!S.name||VIEW)return;try{tick()}catch(e){}let n=0;(function f(){if(rooms().includes(r)){try{if($('game').classList.contains('on'))closeGame();closePf();$('lb').classList.remove('on')}catch(e){}tab='talk';drawList();openRoom(r)}else if(n++<25)setTimeout(f,700)})()};
window.__onResume=()=>{bgAt=0;try{A.schedule('[]');A.clearAll()}catch(e){}try{tick()}catch(e){}};
// 안드로이드 뒤로가기
window.__onBack=()=>{
  const on=id=>{const e=document.getElementById(id);return e&&e.classList.contains('on')?e:null};
  if(on('game')){closeGame();return}
  for(const id of ['lb','modal','rsheet','drawer','pf','lsheet']){const e=on(id);if(e){if(id==='pf')closePf();else if(id==='modal')closeModal();else e.classList.remove('on');return}}
  if(document.body.classList.contains('inroom')){closeRoom();return}
  if(typeof tab!=='undefined'&&tab!=='home'){tab='home';drawList();return}
  A.exit()};
})();
</script>
